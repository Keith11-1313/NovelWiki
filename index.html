<!--
  the main library page — shows all the novels the user has imported
  also has the settings/appearance panel and the recently viewed strip
  scripts: utils.js, store.js, settings.js, library.js
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel Wiki — My Library</title>
  <meta name="description" content="Personal self-hosted fandom wiki for novels. Powered by AI extraction.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta property="og:title" content="Novel Wiki — My Library">
  <meta property="og:description" content="Personal self-hosted fandom wiki for novels. Powered by AI extraction.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Novel Wiki — My Library">
  <meta name="twitter:description" content="Personal self-hosted fandom wiki for novels. Powered by AI extraction.">
  <!-- Anti-FOUC: apply saved theme before first paint -->
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="page-library">
  <div class="library-shell">

    <!-- STORAGE WARNING -->
    <div id="storage-warning" class="storage-warning" style="display:none"></div>

    <!-- LIBRARY HEADER -->
    <div class="library-header">
      <div class="library-hero-row">
        <div>
          <div class="library-title-row">
            <div class="library-badge">
              <img src="favicon.svg" alt="Wiki" style="width:40px;height:40px;">
            </div>
            <div class="library-title">My Novel Library</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
          <a href="import.html" class="btn btn-primary btn-lg">
            <i class="bi bi-plus-circle"></i>Import Novel
          </a>
          <button class="btn btn-ghost btn-lg" onclick="openSettings()" title="Appearance Settings" aria-label="Appearance Settings">
            <i class="bi bi-sliders" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- RECENTLY VIEWED -->
    <div id="recently-viewed" class="recently-viewed" style="display:none"></div>

    <!-- TOOLBAR -->
    <div class="library-toolbar">
      <div class="filter-search" style="max-width:400px;flex:1">
        <i class="bi bi-search"></i>
        <input type="text" id="lib-search" placeholder="Search your library..." oninput="filterLibrary()">
      </div>
      <select class="filter-select" id="lib-genre" onchange="filterLibrary()">
        <option value="">All Genres</option>
        <option value="cultivation">Cultivation</option>
        <option value="tower">Tower</option>
        <option value="regression">Regression</option>
        <option value="system">System</option>
        <option value="isekai">Isekai</option>
        <option value="fantasy">Fantasy</option>
        <option value="sci-fi">Sci-Fi</option>
        <option value="light-novel">Light Novel</option>
        <option value="web-novel">Web Novel</option>
        <option value="other">Other</option>
      </select>
      <select class="filter-select" id="lib-sort" onchange="sortLibrary(this.value)" aria-label="Sort novels by">
        <option value="default">Sort: Default</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
        <option value="chars">Most Characters</option>
        <option value="recent">Recently Added</option>
      </select>
      <button class="btn btn-ghost btn-sm" id="cross-search-btn" onclick="toggleCrossSearch()" title="Search all novels" aria-label="Toggle cross-novel search">
        <i class="bi bi-search-heart"></i>
      </button>
      <span id="lib-count" class="text-muted text-sm"></span>
    </div>

    <!-- NOVEL GRID -->
    <div class="library-grid" id="novel-grid">
      <!-- populated by library.js -->
    </div>

    <!-- EMPTY STATE -->
    <div id="lib-empty" class="empty-state hidden">
      <i class="bi bi-collection"></i>
      <h3>Your library is empty</h3>
      <p>Import your first novel to get started.</p>
      <a href="import.html" class="btn btn-primary mt-16">
        <i class="bi bi-plus-circle"></i>Import Novel
      </a>
    </div>
    <!-- MOBILE BOTTOM TAB BAR -->
    <nav id="mobile-tab-bar" aria-label="Mobile navigation">
      <a class="tab-bar-item active" href="index.html" aria-label="Library">
        <i class="bi bi-collection"></i>
        <span>Library</span>
      </a>
      <a class="tab-bar-item" href="import.html" aria-label="Import">
        <i class="bi bi-plus-circle"></i>
        <span>Import</span>
      </a>
      <button class="tab-bar-item" onclick="openSettings()" aria-label="Settings">
        <i class="bi bi-sliders"></i>
        <span>Settings</span>
      </button>
    </nav>

  </div>


  <!-- Settings modal is injected dynamically by settings.js -->

  <noscript>
    <div class="noscript-banner">
      <strong>JavaScript is required</strong> to run Novel Wiki.
      Please enable JavaScript in your browser and reload the page.
    </div>
  </noscript>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/library.js"></script>
</body>
</html>
