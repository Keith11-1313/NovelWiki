<!--
  the actual wiki viewer page — shows all the novel's data in sections
  the whole sidebar + content area is controlled by wiki.js and render.js
  scripts: utils.js, store.js, genre.js, search.js, render.js, settings.js, wiki.js
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel Wiki</title>
  <meta name="description" content="Personal self-hosted fandom wiki for novels. Powered by AI extraction.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta property="og:title" content="Novel Wiki">
  <meta property="og:description" content="Personal self-hosted fandom wiki for novels. Powered by AI extraction.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Novel Wiki">
  <meta name="twitter:description" content="Personal self-hosted fandom wiki for novels. Powered by AI extraction.">
  <!-- Anti-FOUC: apply saved theme before first paint -->
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- DOMPurify for safe HTML sanitization -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body class="page-wiki">
<div id="app">

  <!-- ═══ SIDEBAR ═══ -->
  <aside id="sidebar">
    <a href="index.html" class="sidebar-logo" style="text-decoration:none;cursor:pointer" title="Back to Library">
      <div class="logo-icon"><img src="favicon.svg" alt="W" style="width:20px;height:20px;"></div>
      <div>
        <div class="logo-text">Novel Wiki</div>
        <div class="logo-sub">Personal Fandom Wiki</div>
      </div>
    </a>

    <div class="sidebar-novel-info">
      <div class="sidebar-novel-title" id="sb-title">Loading...</div>
      <div class="sidebar-novel-genre" id="sb-genre"></div>
    </div>

    <nav class="sidebar-nav" id="sb-nav">
      <!-- populated by wiki.js -->
    </nav>

    <div class="sidebar-bottom">
      <a href="index.html" class="btn-home" aria-label="Back to My Novel Library" style="color:var(--text-primary);font-size:13px;font-weight:600;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:4px;">
        <i class="bi bi-arrow-left-circle-fill" style="color:var(--accent);font-size:15px;"></i> Back to Library
      </a>
      <a href="import.html" class="btn-home">
        <i class="bi bi-plus-circle"></i>Import Novel
      </a>
      <button class="settings-btn" onclick="openSettings()">
        <i class="bi bi-sliders"></i>Appearance
      </button>
    </div>
  </aside>

  <!-- ═══ SIDEBAR BACKDROP (mobile) ═══ -->
  <div id="sidebar-backdrop"></div>

  <!-- ═══ MAIN ═══ -->
  <div id="main">

    <!-- Header -->
    <header id="header">
      <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Toggle navigation menu"><i class="bi bi-list" aria-hidden="true"></i></button>
      <a href="index.html" class="header-logo-link" title="Back to Library" style="display:flex;align-items:center;flex-shrink:0;text-decoration:none;">
        <img src="favicon.svg" alt="Wiki" style="width:24px;height:24px;">
      </a>
      <div class="header-breadcrumb">
        <span id="hdr-novel" class="text-muted" style="cursor:pointer" onclick="Router.go('overview')"></span>
        <i class="bi bi-chevron-right" id="hdr-sep" style="display:none"></i>
        <span id="hdr-page" class="crumb-active"></span>
      </div>

      <!-- Search with autocomplete dropdown -->
      <div class="header-search" style="position:relative;">
        <i class="bi bi-search"></i>
        <input type="text" id="search-input" placeholder="Search wiki… (press /)" autocomplete="off">
        <div id="search-dropdown" class="search-dropdown"></div>
      </div>

      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        <button class="btn btn-ghost btn-sm" onclick="openChapterModal()" id="wiki-chapter-btn" title="Reading Progress" aria-label="Reading progress tracker">
          <i class="bi bi-bookmark" aria-hidden="true"></i>
        </button>
        <button class="btn btn-ghost btn-sm" onclick="printPage()" title="Print / Export PDF" aria-label="Print this wiki page">
          <i class="bi bi-printer" aria-hidden="true"></i>
        </button>
        <a href="import.html" class="btn btn-secondary btn-sm" title="Import / Update" aria-label="Import or update novel">
          <i class="bi bi-box-arrow-in-down" aria-hidden="true"></i>
        </a>
      </div>
    </header>

    <!-- Content -->
    <main id="content">
      <div class="empty-state">
        <i class="bi bi-hourglass-split"></i>
        <h3>Loading wiki...</h3>
      </div>
    </main>

  </div>
</div>


<!-- Settings modal is injected dynamically by settings.js -->

<noscript>
  <div class="noscript-banner">
    <strong>JavaScript is required</strong> to run Novel Wiki.
    Please enable JavaScript in your browser and reload the page.
  </div>
</noscript>

<!-- ═══ NOTES MODAL ═══ -->
<div class="note-modal" id="note-modal">
  <div class="note-modal-panel">
    <div class="note-modal-header">
      <div class="note-modal-title" id="note-modal-title">Notes</div>
      <button class="settings-close" onclick="closeNoteModal()" aria-label="Close notes"><i class="bi bi-x"></i></button>
    </div>
    <textarea id="note-textarea" class="note-textarea" placeholder="Add your personal notes here…" rows="8"></textarea>
    <div class="note-modal-actions">
      <button class="btn btn-ghost" onclick="closeNoteModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNote()"><i class="bi bi-save"></i> Save Note</button>
    </div>
  </div>
</div>

<!-- ═══ CHAPTER TRACKER MODAL ═══ -->
<div class="chapter-modal" id="chapter-modal">
  <div class="chapter-modal-panel">
    <div class="note-modal-header">
      <div class="note-modal-title"><i class="bi bi-bookmark"></i> Reading Progress</div>
      <button class="settings-close" onclick="closeChapterModal()" aria-label="Close tracker"><i class="bi bi-x"></i></button>
    </div>
    <div class="chapter-field">
      <label class="chapter-label">Current Chapter / Volume</label>
      <input type="text" id="chapter-input" class="publish-input" placeholder="e.g. Chapter 247 or Volume 3">
    </div>
    <div class="chapter-field">
      <label class="chapter-label">Notes / Thoughts</label>
      <textarea id="chapter-notes" class="note-textarea" rows="4" placeholder="What's happening at this point…"></textarea>
    </div>
    <div class="chapter-updated text-muted text-sm" id="chapter-updated"></div>
    <div class="note-modal-actions">
      <button class="btn btn-ghost" onclick="closeChapterModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveChapter()"><i class="bi bi-save"></i> Save Progress</button>
    </div>
  </div>
</div>

<!-- ═══ SCRIPTS ═══ -->
<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/genre.js"></script>
<script src="js/search.js"></script>
<script src="js/render.js"></script>
<script src="js/settings.js"></script>
<script src="js/wiki.js"></script>
</body>
</html>
